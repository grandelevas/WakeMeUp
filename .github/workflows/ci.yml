name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          elif [ -d /Applications/Xcode_26.5.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.5.app
          else
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i simulator || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Choose a simulator
        id: sim
        run: |
          set -euo pipefail
          UDID="$(python3 scripts/select-simulator.py)"
          echo "udid=${UDID}" >> "$GITHUB_OUTPUT"
          echo "Using simulator ${UDID}"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project WakeMeUp.xcodeproj \
            -scheme WakeMeUp \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults \
            CODE_SIGN_STYLE=Manual \
            "CODE_SIGN_IDENTITY=-" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            ENABLE_DEBUG_DYLIB=NO

      - name: Capture simulator screenshots
        run: bash scripts/ci-screenshots.sh "${{ steps.sim.outputs.udid }}"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: screenshots
          if-no-files-found: ignore

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
